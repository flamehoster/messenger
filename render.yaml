# Render Blueprint: Dashboard → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: max-drognev
    runtime: node
    plan: starter            # на free диска нет — аккаунты стираются при каждом перезапуске
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: max-data
      mountPath: /var/data
      sizeGB: 1
